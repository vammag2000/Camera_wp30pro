<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Slit-Scan Time Warp</title>
<style>
  body{margin:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100dvh;background:#000}
  video{display:none}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
         /* Исправление переворота: если картинка всё ещё перевёрнута, 
            раскомментируйте transform ниже */
         /* transform: scaleY(-1); */ }
  #ui{position:absolute;bottom:0;left:0;right:0;padding:16px;
      background:linear-gradient(transparent,rgba(0,0,0,0.9));
      display:flex;flex-direction:column;gap:10px;z-index:10}
  .row{display:flex;gap:10px}
  select,button{padding:14px;border-radius:8px;border:1px solid #0f0;
      background:rgba(0,20,0,0.8);color:#0f0;font-size:14px;font-family:monospace;
      text-transform:uppercase;font-weight:bold;letter-spacing:1px}
  button:active{background:#0f0;color:#000}
  .row>*{flex:1}
  #status{position:absolute;top:10px;left:10px;font-size:12px;color:#0f0;
      background:rgba(0,0,0,0.5);padding:5px 10px;border-left:2px solid #0f0;z-index:10}
  input[type=range]{width:100%;accent-color:#0f0}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">SYS.INIT...</div>
  <div id="ui">
    <select id="cameraSelect"></select>
    <div class="row">
      <select id="modeSelect">
        <option value="vertical">Вертикальные полосы</option>
        <option value="horizontal">Горизонтальные полосы</option>
      </select>
      <button id="btn-snap">📸 СНИМОК</button>
    </div>
    <div>
      <label style="font-size:12px;color:#888">Скорость (срезы):</label>
      <input type="range" id="speedRange" min="1" max="20" value="5">
    </div>
  </div>
</div>

<script>
(async function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = document.getElementById('status');

  let currentStream = null;
  let slices = 5; // Сколько "временных слоёв" смешивать
  let mode = 'vertical'; // 'vertical' или 'horizontal'
  let frames = []; // Буфер кадров

  // --- Инициализация камеры ---
  async function listCameras(){
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('cameraSelect');
    sel.innerHTML = '';
    cams.forEach((cam, i) => {
      const opt = document.createElement('option');
      opt.value = cam.deviceId;
      opt.textContent = cam.label || `CAM ${i+1}`;
      sel.appendChild(opt);
    });
    return cams;
  }

  async function startCamera(deviceId){
    if(currentStream) currentStream.getTracks().forEach(t => t.stop());
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          facingMode: 'environment', // ВАЖНО: задняя камера
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      video.srcObject = currentStream;
      await video.play();
      statusEl.textContent = 'SYS.ACTIVE // SLIT-SCAN';
    } catch(e) { statusEl.textContent = 'ERR: ' + e.message; }
  }

  await listCameras();
  const firstCam = document.getElementById('cameraSelect').value;
  if(firstCam) await startCamera(firstCam);

  document.getElementById('cameraSelect').addEventListener('change', e => startCamera(e.target.value));

  // --- Логика Slit-Scan ---
  function render(){
    if(video.readyState >= 2){
      if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      // Сохраняем текущий кадр в буфер
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      frames.push(currentFrame);
      if(frames.length > slices) frames.shift();

      if(frames.length > 1){
        // Перерисовываем холст полосами из разных кадров
        const w = canvas.width;
        const h = canvas.height;

        if(mode === 'vertical'){
          const sliceWidth = w / frames.length;
          for(let i=0; i<frames.length; i++){
            ctx.putImageData(frames[i], 0, 0, Math.floor(i*sliceWidth), 0, Math.ceil(sliceWidth), h);
          }
        } else {
          const sliceHeight = h / frames.length;
          for(let i=0; i<frames.length; i++){
            ctx.putImageData(frames[i], 0, 0, 0, Math.floor(i*sliceHeight), w, Math.ceil(sliceHeight));
          }
        }
      }
    }
    requestAnimationFrame(render);
  }
  render();

  // --- UI ---
  document.getElementById('modeSelect').addEventListener('change', e => {
    mode = e.target.value;
    frames = []; // Сбрасываем буфер при смене режима
  });

  document.getElementById('speedRange').addEventListener('input', e => {
    slices = parseInt(e.target.value);
    frames = []; // Сбрасываем буфер при изменении скорости
  });

  document.getElementById('btn-snap').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'slitscan-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
})();
</script>
</body>
</html>
